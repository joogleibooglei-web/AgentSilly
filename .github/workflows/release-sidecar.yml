name: Release Sidecar Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: eni-sidecar-linux-x64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: eni-sidecar-darwin-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: eni-sidecar-darwin-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: eni-sidecar-win32-x64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            eni-sidecar/target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('eni-sidecar/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
        working-directory: eni-sidecar

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cp eni-sidecar/target/${{ matrix.target }}/release/eni-sidecar ${{ matrix.artifact_name }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: |
          cp eni-sidecar/target/${{ matrix.target }}/release/eni-sidecar.exe ${{ matrix.artifact_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  release:
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ENI Sidecar ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
          body: |
            ## ENI Sidecar ${{ github.ref_name }}

            Cross-platform binaries for the ENI World Builder sidecar.

            ### Downloads

            | Platform | Architecture | Binary |
            |----------|-------------|--------|
            | macOS | Apple Silicon (arm64) | `eni-sidecar-darwin-arm64` |
            | macOS | Intel (x64) | `eni-sidecar-darwin-x64` |
            | Linux | x64 | `eni-sidecar-linux-x64` |
            | Windows | x64 | `eni-sidecar-win32-x64.exe` |

            ### Installation

            1. Download the binary for your platform
            2. Place it in the extension's `bin/` directory
            3. On macOS/Linux, make it executable: `chmod +x eni-sidecar-*`
            4. Restart SillyTavern to auto-detect the binary

            ### Changelog

            See auto-generated release notes below for commit history since the last release.
